<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Library Circulation</title>
</head>
<body>
    <div layout:fragment="content">

        <!-- Notification Zone -->
        <div id="notification-zone" class="space-y-3">
            <div th:if="${successMessage}"
                class="bg-green-50 border-l-4 border-green-500 rounded-r-xl p-4 flex items-start gap-3 shadow-sm">
                <div class="text-green-500 mt-0.5">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-green-800">Transaction Successful</h4>
                    <p class="text-sm text-green-700 mt-0.5" th:text="${successMessage}">Book issued successfully.</p>
                </div>
            </div>

            <div th:if="${errorMessage}"
                class="bg-amber-50 border-l-4 border-amber-500 rounded-r-xl p-4 flex items-start gap-3 shadow-sm">
                <div class="text-amber-500 mt-0.5">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h4 class="text-sm font-semibold text-amber-800">Transaction Failed</h4>
                    <p class="text-sm text-amber-700 mt-0.5" th:text="${errorMessage}">Unable to complete checkout.</p>
                </div>
            </div>
        </div>

        <!-- Checkout & Return Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Quick Checkout Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l7-7m0 0l-7-7m7 7H3" />
                    </svg>
                    <h3 class="font-medium text-gray-800 text-lg">Quick Checkout</h3>
                </div>

                <div class="p-6">
                    <form th:action="@{/circulation/checkout}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Scan Accession ID / Barcode</label>
                            <input type="text" name="accessionId"
                                class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-base font-mono placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                                placeholder="Focus here & scan..." autofocus required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Borrower ID</label>
                            <input type="text" name="borrowerId"
                                class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                                placeholder="Enter Borrower ID..." required>
                        </div>
                        <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md mt-4 transition shadow-sm">
                            Complete Checkout
                        </button>
                    </form>
                </div>
            </div>

            <!-- Quick Return Card -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-5 border-b border-gray-100 flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                    </svg>
                    <h3 class="font-medium text-gray-800 text-lg">Quick Return</h3>
                </div>
                <div class="p-6">
                    <form th:action="@{/circulation/return}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Scan Accession ID / Barcode to Return</label>
                            <input type="text" name="accessionId"
                                class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-base font-mono placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                                placeholder="Focus here & scan..." required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">Condition Assessment</label>
                            <select name="condition"
                                class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition">
                                <option value="Good">Good (No Change)</option>
                                <option value="New">New</option>
                                <option value="Damaged">Damaged (Assess Fine)</option>
                            </select>
                        </div>
                        <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md mt-4 transition shadow-sm">
                            Process Return
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Optional Page Script (if needed) -->
        <script>
            // Any specific JavaScript for circulation can stay here
        </script>

    </div>
</body>
</html>
