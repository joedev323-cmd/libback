<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Library Catalog Detail</title>
</head>
<body>
    <div layout:fragment="content">

        <!-- Title & Header Actions Card -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                    <h2 class="text-2xl font-semibold text-gray-800 mb-1" th:text="${item?.title}">Book Title</h2>
                    <h5 class="text-lg font-medium text-purple-600" th:text="'By ' + ${item?.author}">Author Name</h5>
                    <p class="text-sm text-gray-500 mt-2 flex items-center gap-2">
                        <span class="font-semibold text-gray-700">ISBN:</span>
                        <span class="font-mono bg-gray-100 px-2 py-0.5 rounded text-gray-800" th:text="${item?.isbn}">0000000000</span>
                    </p>
                </div>

                <div class="flex items-center gap-3 flex-shrink-0">
                    <a th:href="@{/Catalogue/edit/{isbn}(isbn=${item?.isbn})}"
                        class="inline-flex items-center justify-center bg-white border border-gray-300 hover:border-purple-600 text-gray-700 hover:text-purple-600 font-medium px-4 py-2.5 rounded-lg text-sm transition shadow-sm gap-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                        </svg>
                        Edit Book
                    </a>

                    <a th:href="@{/admin/catalog/add}"
                        class="inline-flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-medium px-4 py-2.5 rounded-lg text-sm transition shadow-sm gap-2">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                        Register New Title
                    </a>
                </div>
            </div>
        </div>

        <!-- Batch Add Physical Copies Form -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-medium text-gray-800 text-lg">Batch Add Physical Copies (Accessions)</h3>
            </div>
            <div class="p-6 bg-gray-50/50">
                <form th:action="@{/catalog/{id}/accessions/batch(id=${item?.isbn})}" method="POST"
                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Prefix / Type</label>
                        <input type="text" name="prefix"
                            class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                            placeholder="e.g., MAG-202606" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Quantity to Generate</label>
                        <input type="number" name="quantity"
                            class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                            min="1" value="1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Initial Location (Shelf)</label>
                        <input type="text" name="shelfLocation"
                            class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                            placeholder="e.g., A-12" required>
                    </div>
                    <div>
                        <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md transition shadow-sm text-center text-sm">
                            Generate Accessions
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tracked Accessions Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-5 border-b border-gray-100">
                <h3 class="text-lg font-medium text-gray-800">Tracked Accessions (Copies)</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-100">
                            <th class="px-6 py-4">Accession ID</th>
                            <th class="px-6 py-4">Copy No.</th>
                            <th class="px-6 py-4">Barcode</th>
                            <th class="px-6 py-4">Location</th>
                            <th class="px-6 py-4">Condition</th>
                            <th class="px-6 py-4">Status</th>
                        </tr>
                    </thead>
                    <tbody class="text-sm text-gray-600 divide-y divide-gray-100">
                        <tr th:each="copy : ${accessions}" class="hover:bg-gray-50/70 transition">
                            <td class="px-6 py-4 font-mono font-bold text-purple-600" th:text="${copy?.accessionId}">MAG-20260617-0001</td>
                            <td class="px-6 py-4 font-mono" th:text="${copy?.copyNumber}">1</td>
                            <td class="px-6 py-4 font-mono text-gray-700" th:text="${copy?.barcode}">BC-998231</td>
                            <td class="px-6 py-4 text-gray-800" th:text="${copy?.shelfLocation}">Shelf A-12</td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-medium rounded-full"
                                    th:classappend="${copy?.conditionStatus?.name() == 'GOOD' ? 'bg-green-50 text-green-700' : (copy?.conditionStatus?.name() == 'DAMAGED' ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-700')}"
                                    th:text="${copy?.conditionStatus}">GOOD</span>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2.5 py-1 text-xs font-medium rounded-full"
                                    th:classappend="${copy?.availabilityStatus?.name() == 'AVAILABLE' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}"
                                    th:text="${copy?.availabilityStatus}">AVAILABLE</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
