<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Edit Book - BiblioHub</title>
</head>
<body>
    <div layout:fragment="content">

        <main class="space-y-6 max-w-4xl w-full mx-auto">

            <div class="flex items-center justify-between">
                <a th:href="@{/Catalogue}"
                    class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-purple-600 transition gap-1.5">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15 19l-7-7 7-7" />
                    </svg>
                    Back to Catalog List
                </a>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                <div class="border-b border-gray-100 pb-5 mb-6">
                    <h3 class="text-xl font-semibold text-gray-800">Edit Catalog Metadata</h3>
                    <p class="text-sm text-gray-500 mt-1">Modify core metadata properties for this global collection master record.</p>
                </div>

                <form th:action="@{/Catalogue/update/{isbn}(isbn=${item.isbn})}"
                    th:object="${item}" method="POST" class="space-y-5">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Book Title</label>
                            <input type="text" th:field="*{title}"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="Enter item title..." required>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Author</label>
                            <input type="text" th:field="*{author}"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="Enter author name..." required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">International Standard Book Number (ISBN)</label>
                        <input type="text" th:field="*{isbn}"
                            class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                            placeholder="e.g., 9780141182605" required>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Publisher</label>
                            <input type="text" th:field="*{publisher}"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="Enter publisher...">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Edition</label>
                            <input type="text" th:field="*{edition}"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="e.g., 3rd Edition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Asset Description / Book Summary</label>
                        <textarea th:field="*{description}" rows="4"
                            class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                            placeholder="Enter book summary or catalog registry notes..."></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Assigned Categories</label>
                        <div class="border border-gray-200 rounded p-4 max-h-48 overflow-y-auto space-y-2 bg-gray-50/50">
                            <div th:each="cat : ${categories}"
                                class="flex items-center gap-3">
                                <input type="checkbox"
                                    th:field="*{categories}"
                                    th:value="${cat.categoryId}"
                                    class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                                <label th:for="${#ids.prev('categories')}"
                                    class="text-sm text-gray-700 font-medium select-none cursor-pointer"
                                    th:text="${cat.name}">Category Name</label>
                            </div>
                            <div th:if="${#lists.isEmpty(categories)}"
                                class="text-sm text-gray-400 italic">
                                No system categories configured.
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-8">
                        <a th:href="@{/Catalogue}"
                            class="inline-flex items-center justify-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm">
                            Cancel Changes
                        </a>
                        <button type="submit"
                            class="inline-flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm">
                            Save Modifications
                        </button>
                    </div>

                </form>
            </div>

        </main>

    </div>
</body>
</html>
