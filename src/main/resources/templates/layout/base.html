<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - BiblioHub">BiblioHub</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    
</head>
<body class="bg-gray-100 min-h-screen flex">

    <!-- Reusable Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
            <div class="flex items-center gap-4">
                <h2 class="text-xl font-semibold text-gray-800 md:block hidden">Library Administration</h2>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right hidden sm:block">
                    <p class="text-sm font-medium text-gray-800" th:text="${username != null ? username : 'Librarian'}">Librarian</p>
                    <p class="text-xs text-gray-500">Staff Dashboard</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium">
                    👤
                </div>
            </div>
        </header>

        <!-- Dynamic Content Slot -->
        <main class="p-6 space-y-6 flex-1 overflow-y-auto">
            <div layout:fragment="content">
                <!-- Page content injected here -->
            </div>
        </main>
    </div>

</body>
</html>
