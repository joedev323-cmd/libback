<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Library Members - BiblioHub</title>
</head>
<body>
    <div layout:fragment="content">

        <main class="p-6 space-y-6 flex-1 overflow-y-auto">

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                
                <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="text-lg font-medium text-gray-800">Registered Roster</h3>
                    <div class="flex gap-2">
                        <a th:href="@{/admin/add/member}" role="button"
                            class="inline-block bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium px-4 py-2 rounded transition shadow-sm text-center">
                            + Register New Member
                        </a>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-100">
                                <th class="px-6 py-4">Card ID / Account No</th>
                                <th class="px-6 py-4">Full Name</th>
                                <th class="px-6 py-4">Contact Email Address</th>
                                <th class="px-6 py-4">Books Loaned</th>
                                <th class="px-6 py-4">Status Label</th>
                            </tr>
                        </thead>
                        <tbody class="text-sm text-gray-600 divide-y divide-gray-100">

                            <tr th:each="member : ${members}" class="hover:bg-gray-50/70 transition">
                                <td class="px-6 py-4 font-mono font-bold text-purple-600" 
                                    th:text="${member.borrowerId}">M-000</td>
                                <td class="px-6 py-4 font-medium text-gray-800" 
                                    th:text="${member.name}">Testing Account Name</td>
                                <td class="px-6 py-4" 
                                    th:text="${member.email}">test@example.com</td>
                                <td class="px-6 py-4" 
                                    th:text="${member.borrowedCount != null ? member.borrowedCount : 0}">0</td>
                                <td class="px-6 py-4">
                                    <span th:if="${member.active}" 
                                          class="inline-flex px-2.5 py-1 text-xs font-medium rounded-full bg-green-50 text-green-600">
                                        Active
                                    </span>
                                    <span th:if="${!member.active}" 
                                          class="inline-flex px-2.5 py-1 text-xs font-medium rounded-full bg-red-50 text-red-600">
                                        Inactive
                                    </span>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(members)}">
                                <td colspan="5" class="px-6 py-10 text-center text-gray-400">
                                    No registered members found. Click "+ Register New Member" to add one!
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>

        </main>

    </div>
</body>
</html>
