<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Register New Member - BiblioHub</title>
</head>
<body>
    <div layout:fragment="content">

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden max-w-2xl mx-auto">
            
            <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-lg font-medium text-gray-800">Register New Member</h3>
            </div>

            <!-- Error Message -->
            <div th:if="${errorMessage}"
                class="mx-6 mt-6 p-4 bg-red-50 text-red-700 rounded-lg text-sm border border-red-200 flex items-center gap-2">
                <span>❌</span>
                <p th:text="${errorMessage}">Error registering member.</p>
            </div>

            <!-- Member Registration Form -->
            <form th:action="@{/admin/add/member}" th:object="${borrower}"
                method="POST" class="p-6 space-y-4">

                <!-- Note: Spring Security CSRF is typically handled automatically by Spring, 
                     but kept explicitly here if required by your configuration -->
                <input type="hidden" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}" th:if="${_csrf != null}" />

                <div>
                    <label for="borrowerId"
                        class="block text-sm font-medium text-gray-700 mb-1">Card ID / Account No</label>
                    <input type="text" id="borrowerId" th:field="*{borrowerId}"
                        placeholder="M-000" required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 font-mono text-purple-600">
                </div>

                <div>
                    <label for="name"
                        class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="name" th:field="*{name}"
                        placeholder="Testing Account Name" required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-gray-800">
                </div>

                <div>
                    <label for="email"
                        class="block text-sm font-medium text-gray-700 mb-1">Contact Email Address</label>
                    <input type="email" id="email" th:field="*{email}"
                        placeholder="test@example.com" required
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-gray-800">
                </div>

                <div>
                    <label for="memberType"
                        class="block text-sm font-medium text-gray-700 mb-1">Membership Class Type</label>
                    <select id="memberType" th:field="*{memberType}"
                        class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 bg-white text-gray-800">
                        <option value="STUDENT">Student</option>
                        <option value="faculty">Staff / Faculty</option>
                        <option value="regular">Super Admin</option>
                    </select>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100">
                    <a th:href="@{/members}"
                        class="px-4 py-2 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition text-center shadow-sm">
                        Cancel
                    </a>
                    <button type="submit"
                        class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium px-4 py-2 rounded transition shadow-sm text-center">
                        Save Registration
                    </button>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
