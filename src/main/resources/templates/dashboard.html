<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}">
  <head>
    <title>Library Dashboard</title>
  </head>
  <body>
    <div layout:fragment="content">

      <!-- Stat Cards Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div
          class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
          <div>
            <p
              class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total
              Books</p>
            <p class="text-3xl font-semibold text-gray-800 mt-1"
              th:text="${stats != null ? stats.totalBooks : '0'}">0</p>
          </div>
          <div class="p-3 rounded-lg bg-purple-50 text-purple-600">📚</div>
        </div>

        <div
          class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
          <div>
            <p
              class="text-sm font-medium text-gray-500 uppercase tracking-wider">Books
              Out</p>
            <p class="text-3xl font-semibold text-gray-800 mt-1"
              th:text="${stats != null ? stats.booksOut : '0'}">0</p>
          </div>
          <div class="p-3 rounded-lg bg-blue-50 text-blue-600">📦</div>
        </div>

        <div
          class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
          <div>
            <p
              class="text-sm font-medium text-gray-500 uppercase tracking-wider">Overdue</p>
            <p class="text-3xl font-semibold mt-1"
              th:classappend="${stats != null && stats.overdueCount > 0 ? 'text-red-600' : 'text-gray-800'}"
              th:text="${stats != null ? stats.overdueCount : '0'}">0</p>
          </div>
          <div class="p-3 rounded-lg bg-red-50 text-red-600">⚠️</div>
        </div>

        <div
          class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
          <div>
            <p
              class="text-sm font-medium text-gray-500 uppercase tracking-wider">Active
              Members</p>
            <p class="text-3xl font-semibold text-gray-800 mt-1"
              th:text="${stats != null ? stats.activeMembers : '0'}">0</p>
          </div>
          <div class="p-3 rounded-lg bg-green-50 text-green-600">👥</div>
        </div>
      </div>

      <!-- Recent Circulation Log Table -->
      <div
        class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div
          class="px-6 py-5 border-b border-gray-100 flex items-center justify-between">
          <h3 class="text-lg font-medium text-gray-800">Recent Book Circulation
            Log</h3>
          <a th:href="@{/circulation}"
            class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium px-4 py-2 rounded transition">
            + Issue Book
          </a>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr
                class="bg-gray-50 text-gray-500 text-xs font-semibold uppercase tracking-wider border-b border-gray-100">
                <th class="px-6 py-4">Book Title</th>
                <th class="px-6 py-4">Borrower</th>
                <th class="px-6 py-4">Action</th>
                <th class="px-6 py-4">Due Date</th>
                <th class="px-6 py-4">Status</th>
              </tr>
            </thead>
            <tbody class="text-sm text-gray-600 divide-y divide-gray-100">
              <tr th:each="log : ${logs}"
                class="hover:bg-gray-50/70 transition">
                <td class="px-6 py-4 font-medium text-gray-800"
                  th:text="${log.bookTitle}">The Great Gatsby</td>
                <td class="px-6 py-4"
                  th:text="${log.borrowerName + ' (' + log.borrowerId + ')'}">Robert
                  Downey (M-402)</td>
                <td class="px-6 py-4" th:text="${log.action}">Issued</td>
                <td class="px-6 py-4 text-gray-500"
                  th:text="${log.dueDate != null ? #temporals.format(log.dueDate, 'MMM dd, yyyy') : '—'}"
                  th:classappend="${log.getIsOverdue ? 'text-red-500 font-semibold' : ''}">Jul
                  08, 2026</td>
                <td class="px-6 py-4">
                  <span
                    class="inline-flex px-2.5 py-1 text-xs font-medium rounded-full"
                    th:text="${log.status}"
                    th:classappend="${log.status == 'On Loan' ? 'bg-blue-50 text-blue-600' : (log.status == 'In Library' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600')}">
                    On Loan
                  </span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="5" class="px-6 py-10 text-center text-gray-400">
                  No recent circulation logs found in database.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </body>
</html>
